[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sctransform-cpu"
version = "0.3.0"
description = "Python-first SCTransform v2 reference for CPU optimization and RAPIDS-compatible GPU research"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Bowen Man"}]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/Bowen-Man/sctransform-cpu"
Source = "https://github.com/Bowen-Man/sctransform-cpu"
Issues = "https://github.com/Bowen-Man/sctransform-cpu/issues"
Changelog = "https://github.com/Bowen-Man/sctransform-cpu/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = ["psutil>=5.9"]
release = ["build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
